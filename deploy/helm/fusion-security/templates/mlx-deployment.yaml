{{- if .Values.fusionMLX.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fusion-mlx.fullname" . }}
  labels:
    {{- include "fusion-mlx.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fusion-mlx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fusion-mlx.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: fusion-mlx
          image: "{{ .Values.fusionMLX.image.repository }}:{{ .Values.fusionMLX.image.tag }}"
          imagePullPolicy: {{ .Values.fusionMLX.image.pullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.fusionMLX.resources | nindent 12 }}
          volumeMounts:
            - name: mlx-models
              mountPath: /models
      volumes:
        - name: mlx-models
        {{- if .Values.fusionMLX.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "fusion-mlx.fullname" . }}-models
        {{- else }}
          emptyDir: {}
        {{- end }}
{{- end }}
