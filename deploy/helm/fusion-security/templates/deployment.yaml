apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fusion-security.fullname" . }}
  labels:
    {{- include "fusion-security.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fusion-security.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fusion-security.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        # 非 root + 只读根文件系统(/app/data 由 PVC 可写挂载)。
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: false
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      containers:
        - name: fusion-security
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 11454
              protocol: TCP
          env:
            - name: FUSION_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: FUSION_SEVERITY_THRESHOLD
              value: {{ .Values.config.severityThreshold | quote }}
            - name: FUSION_ENABLE_AI
              value: {{ .Values.config.enableAI | quote }}
            # MLX_BASE_URL 为代码权威来源;FUSION_MLX_URL 保留兼容(回退读取)。
            - name: MLX_BASE_URL
              value: "http://{{ include "fusion-mlx.fullname" . }}:{{ .Values.fusionMLX.service.port }}/v1"
            - name: FUSION_DB_PATH
              value: /app/data/fusion.db
            {{- if .Values.config.model }}
            - name: FUSION_MODEL
              value: {{ .Values.config.model | quote }}
            {{- end }}
          # liveness 走公开 /health(无鉴权,供探针);readiness 同。
          # /health/detailed 已鉴权(Wave 4),探针无 API key 不能用。
          livenessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 11454
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/system/health
              port: 11454
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: scan-data
              mountPath: /app/data
      volumes:
        - name: scan-data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "fusion-security.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
