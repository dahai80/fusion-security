[project]
name = "fusion-security"
version = "0.1.0"
description = "Fusion-Security — Local AI-powered code security audit tool. macOS Apple Silicon native, 100% offline, powered by fusion-mlx."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
fusion-security = "fusion_security.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fusion_security*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"