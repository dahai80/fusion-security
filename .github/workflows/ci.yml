name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Issue #99: docs-only changes skip the test gate (docs.yml still runs).
    paths-ignore:
      - "**.md"
  # Issue #99 tiered gate: nightly full suite on main is the authoritative
  # run; per-PR jobs stay the fast gate and are never replaced by batched runs.
  schedule:
    - cron: "20 19 * * *"

# Issue #99: cancel superseded runs on the same ref (PR force-push churn).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # Issue #99: pip cache keyed on the manifest (deps resolve from git
        # siblings + local extras; no lockfile to hash).
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install fusion-core (in-tree dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-core.git
        # fusion-core is an in-tree editable install in the monorepo venv
        # but has no PyPI release, so CI resolves it from git. See
        # dahai80/fusion-core#9 for the permanent publish-track fix.
        # fusion-core pins requires-python>=3.12 (monorepo unified version),
        # so CI must run on 3.12, not 3.11.
      - name: Install fusion-identity (sibling dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-identity.git
        # fusion-identity is a monorepo sibling (Issue #32 dependency) with
        # no PyPI release; CI resolves it from git like fusion-core.
      - run: pip install -e ".[lint]"
      - run: ruff check fusion_security/ tests/
      - run: ruff format --check fusion_security/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # Issue #99: pip cache keyed on the manifest.
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install fusion-core (in-tree dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-core.git
        # See dahai80/fusion-core#9 for the permanent publish-track fix.
      - name: Install fusion-identity (sibling dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-identity.git
      - run: pip install -e ".[test]"
      - run: pytest tests/ -v --tb=short -q
      - run: pytest tests/ --cov=fusion_security --cov-fail-under=90
      - name: README test-count drift guard (Issue #43)
        run: python scripts/check_test_count.py
        # Fails when the README badge count drifts >10% from the collected
        # count. Refresh with: pytest --collect-only -q | tail -1

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # Issue #99: pip cache keyed on the manifest (deps resolve from git
        # siblings + local extras; no lockfile to hash).
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install fusion-core (in-tree dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-core.git
        # See dahai80/fusion-core#9 for the permanent publish-track fix.
      - name: Install fusion-identity (sibling dependency, not on PyPI)
        run: pip install git+https://github.com/dahai80/fusion-identity.git
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
