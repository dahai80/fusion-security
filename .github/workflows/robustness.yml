name: robustness

on:
  schedule:
    # Nightly 18:40 UTC — not PR-blocking (model-load cost); a red run
    # blocks release tags, not merges.
    - cron: "40 18 * * *"
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install httpx
      - name: Run robustness self-test
        # Runners without a loaded MLX model exit 0 with result=SKIPPED —
        # skipped is never reported as passed. A real gate failure exits 1
        # and fails this job.
        run: python scripts/robustness_selftest.py --no-append
      - name: Record result
        if: always()
        run: echo "robustness job finished with ${{ job.status }}"
