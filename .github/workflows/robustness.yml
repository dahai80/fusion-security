name: robustness

on:
  schedule:
    # Nightly 18:40 UTC — not PR-blocking (model-load cost); a red run
    # blocks release tags, not merges.
    - cron: "40 18 * * *"
  workflow_dispatch:

# Issue #99: group nightly runs; no cancel-in-progress — the scheduled
# nightly is authoritative and must not be killed by a manual dispatch.
concurrency:
  group: robustness-${{ github.ref }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # fusion_core is an in-tree sibling imported by the analyzer chain
          # (engine/ai -> fusion_core.http_client); it must come from git
          # like in ci.yml. See dahai80/fusion-core#9.
          pip install git+https://github.com/dahai80/fusion-core.git
          # Full install (not --no-deps): the selftest import chain pulls the
          # AST stack (tree_sitter_c et al.), which --no-deps kept skipping.
          pip install -e .
      - name: Run robustness self-test
        # Runners without a loaded MLX model exit 0 with result=SKIPPED —
        # skipped is never reported as passed. A real gate failure exits 1
        # and fails this job.
        run: python scripts/robustness_selftest.py --no-append
      - name: Record result
        if: always()
        run: echo "robustness job finished with ${{ job.status }}"
