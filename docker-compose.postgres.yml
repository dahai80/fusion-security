# 多节点分布式部署 override:启用共享 PostgreSQL 后端。
# 用法: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up
# 依赖: pip install -e ".[postgres]" (asyncpg + psycopg2-binary)
version: "3.8"

services:
  fusion-security:
    environment:
      # P0-8: 凭据来自宿主环境,不在 compose 里硬编码明文密码。缺失则 compose 启动直接失败。
      - FUSION_SECURITY_DB_URL=postgresql+asyncpg://fusion:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@fusion-postgres:5432/fusion
    depends_on:
      fusion-postgres:
        condition: service_healthy

  fusion-postgres:
    image: postgres:16-alpine
    container_name: fusion-postgres
    environment:
      POSTGRES_USER: fusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: fusion
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusion -d fusion"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
