version: "3.8"

services:
  fusion-security:
    build: .
    container_name: fusion-security
    ports:
      - "8000:8000"
    volumes:
      - scan-data:/app/data
      - ${SCAN_PATH:-/tmp}:/scan:ro
    environment:
      - FUSION_DB_PATH=/app/data/fusion.db
      - FUSION_AI_URL=http://fusion-mlx:8000/v1
      - FUSION_AI_MODEL=qwen3.5-9b
    depends_on:
      fusion-mlx:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  fusion-mlx:
    image: fusion-mlx:latest
    container_name: fusion-mlx
    ports:
      - "8001:8000"
    volumes:
      - mlx-models:/root/.cache/huggingface
    environment:
      - MODEL_NAME=qwen3.5-9b
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  scan-data:
  mlx-models:
